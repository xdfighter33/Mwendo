<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" role="img"><title>PBD Algorithm 1 (Müller et al. 2007)</title><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3d3d3a}.th{font-size:14px;font-weight:500;fill:#3d3d3a}.ts{font-size:12px;fill:#5F5E5A}.arr{stroke:#888780;stroke-width:1.5;fill:none}.c-gray>rect,circle.c-gray,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}circle.c-gray{fill:#B4B2A9}.c-purple>rect,circle.c-purple,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}circle.c-purple{fill:#AFA9EC}.c-coral>rect,circle.c-coral,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}circle.c-coral{fill:#F0997B}.c-teal>rect,circle.c-teal,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}circle.c-teal{fill:#5DCAA5}@media (prefers-color-scheme:dark){.t,.th{fill:#e8e6dc}.ts{fill:#b4b2a9}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#F5C4B3}.c-coral>.ts{fill:#F0997B}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-gray"><rect x="60" y="14" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="82" y="21" dominant-baseline="central">Setup</text><g class="c-purple"><rect x="170" y="14" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="192" y="21" dominant-baseline="central">Predict (guess)</text><g class="c-coral"><rect x="330" y="14" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="352" y="21" dominant-baseline="central">Correct (fix)</text><g class="c-teal"><rect x="480" y="14" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="502" y="21" dominant-baseline="central">Update (derive v)</text>
<g class="c-gray"><rect x="190" y="50" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">Initialize particles</text><text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central">x, v, w = 1/m · line 1</text></g><line x1="340" y1="106" x2="340" y2="132" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="136" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="154" text-anchor="middle" dominant-baseline="central">External forces</text><text class="ts" x="340" y="174" text-anchor="middle" dominant-baseline="central">v ← v + Δt·w·f_ext · line 4</text></g><line x1="340" y1="192" x2="340" y2="218" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="222" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="240" text-anchor="middle" dominant-baseline="central">Damp velocities</text><text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central">ω = I⁻¹L · line 5 · §3.5</text></g><line x1="340" y1="278" x2="340" y2="304" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="308" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="326" text-anchor="middle" dominant-baseline="central">Predict positions</text><text class="ts" x="340" y="346" text-anchor="middle" dominant-baseline="central">p ← x + Δt·v · line 6</text></g><line x1="340" y1="364" x2="340" y2="390" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="190" y="394" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="412" text-anchor="middle" dominant-baseline="central">Collision constraints</text><text class="ts" x="340" y="432" text-anchor="middle" dominant-baseline="central">ray x → p · line 7 · §3.4</text></g><line x1="340" y1="450" x2="340" y2="476" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="190" y="480" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="498" text-anchor="middle" dominant-baseline="central">Project constraints</text><text class="ts" x="340" y="518" text-anchor="middle" dominant-baseline="central">Δpᵢ = −s·wᵢ·∇ᵢC · line 9</text></g><path d="M490 524 L556 524 L556 492 L494 492" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="566" y="508" dominant-baseline="central">× n_s iters</text><line x1="340" y1="536" x2="340" y2="562" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="190" y="566" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="584" text-anchor="middle" dominant-baseline="central">Update velocity, position</text><text class="ts" x="340" y="604" text-anchor="middle" dominant-baseline="central">v ← (p − x)/Δt, x ← p · 12–13</text></g><line x1="340" y1="622" x2="340" y2="648" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="190" y="652" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="670" text-anchor="middle" dominant-baseline="central">Friction, restitution</text><text class="ts" x="340" y="690" text-anchor="middle" dominant-baseline="central">velocityUpdate(v) · line 14</text></g>
<path d="M190 680 L120 680 L120 164 L186 164" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="110" y="422" text-anchor="end" dominant-baseline="central">next Δt</text><text class="ts" x="340" y="736" text-anchor="middle">Constraints E1–E4 plug into “Project constraints”</text>
